<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consejo de Agentes — IA Sin Miedo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #0a0a12;
    --dark2: #12121e;
    --dark3: #1a1a2e;
    --accent: #FF6B6B;
    --accent2: #FFB347;
    --teal: #4ECDC4;
    --purple: #A78BFA;
    --green: #34D399;
    --white: #f8f6f2;
    --muted: #8892a4;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Lato', sans-serif;
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes typing { 0%,100%{opacity:1} 50%{opacity:0} }

  /* NAV */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    padding: 18px 40px;
    background: rgba(10,10,18,0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 900;
    color: var(--white); text-decoration: none;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .nav-back {
    color: var(--muted); text-decoration: none; font-size: 14px;
    transition: color 0.2s;
  }
  .nav-back:hover { color: var(--white); }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 120px 24px 80px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.7s ease forwards;
  }
  .page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;
    margin-bottom: 12px;
  }
  .page-header h1 span { color: var(--accent2); }
  .page-header p {
    color: var(--muted);
    font-size: 16px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* AGENTS ROW */
  .agents-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .agent-badge {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-radius: 50px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 13px;
    color: var(--muted);
    transition: all 0.3s;
  }
  .agent-badge.active {
    border-color: currentColor;
    color: var(--white);
  }
  .agent-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .agent-badge.active .dot {
    opacity: 1;
    animation: pulse 1.2s ease infinite;
  }

  /* INPUT */
  .input-section {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 40px;
  }
  .input-section label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  textarea {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--white);
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    padding: 16px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent2); }
  textarea::placeholder { color: var(--muted); }

  .btn-consult {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.3px;
  }
  .btn-consult:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255,107,107,0.3);
  }
  .btn-consult:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* RESPONSES */
  .responses { display: flex; flex-direction: column; gap: 20px; }

  .agent-card {
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    animation: fadeUp 0.5s ease forwards;
  }

  .agent-card-header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
  }
  .agent-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .agent-name {
    font-weight: 700;
    font-size: 16px;
  }
  .agent-role {
    font-size: 13px;
    color: var(--muted);
  }

  .agent-card-body {
    padding: 0 20px 20px;
    font-size: 15px;
    line-height: 1.75;
    color: #d4d8e0;
  }

  .loading-dots {
    display: flex; gap: 6px; padding: 16px 20px 20px;
  }
  .loading-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.2s ease infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* Agent color themes */
  .card-estratega { border-color: rgba(78,205,196,0.3); background: rgba(78,205,196,0.04); }
  .card-estratega .agent-card-header { background: rgba(78,205,196,0.08); }
  .card-estratega .agent-icon { background: rgba(78,205,196,0.15); }
  .card-estratega .agent-name { color: var(--teal); }

  .card-critico { border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.04); }
  .card-critico .agent-card-header { background: rgba(167,139,250,0.08); }
  .card-critico .agent-icon { background: rgba(167,139,250,0.15); }
  .card-critico .agent-name { color: var(--purple); }

  .card-abogado { border-color: rgba(255,179,71,0.3); background: rgba(255,179,71,0.04); }
  .card-abogado .agent-card-header { background: rgba(255,179,71,0.08); }
  .card-abogado .agent-icon { background: rgba(255,179,71,0.15); }
  .card-abogado .agent-name { color: var(--accent2); }

  .card-verificador { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.04); }
  .card-verificador .agent-card-header { background: rgba(52,211,153,0.08); }
  .card-verificador .agent-icon { background: rgba(52,211,153,0.15); }
  .card-verificador .agent-name { color: var(--green); }

  .card-juez { border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.05); }
  .card-juez .agent-card-header { background: rgba(255,107,107,0.1); }
  .card-juez .agent-icon { background: rgba(255,107,107,0.15); }
  .card-juez .agent-name { color: var(--accent); }
  .card-juez { border-width: 2px; }

  /* RESET */
  .btn-reset {
    display: block;
    margin: 32px auto 0;
    padding: 12px 28px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 50px;
    color: var(--muted);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  .error-msg {
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 12px;
    padding: 16px 20px;
    color: var(--accent);
    font-size: 14px;
    margin-top: 12px;
  }

  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
    main { padding: 100px 16px 60px; }
    .agents-row { gap: 8px; }
    .agent-badge { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">IA Sin <span>Miedo</span></a>
  <a href="index.html" class="nav-back">← Volver al inicio</a>
</nav>

<main>
  <div class="page-header">
    <h1>Consejo de <span>Agentes IA</span></h1>
    <p>5 perspectivas distintas analizan tu pregunta antes de darte una respuesta. Sin filtros, sin "yes men".</p>
  </div>

  <div class="agents-row">
    <div class="agent-badge" id="badge-estratega" style="color: var(--teal)">
      <div class="dot"></div> 🎯 Estratega
    </div>
    <div class="agent-badge" id="badge-critico" style="color: var(--purple)">
      <div class="dot"></div> 🔍 Crítico
    </div>
    <div class="agent-badge" id="badge-abogado" style="color: var(--accent2)">
      <div class="dot"></div> ⚡ Abogado del Diablo
    </div>
    <div class="agent-badge" id="badge-verificador" style="color: var(--green)">
      <div class="dot"></div> ✅ Verificador
    </div>
    <div class="agent-badge" id="badge-juez" style="color: var(--accent)">
      <div class="dot"></div> ⚖️ Juez
    </div>
  </div>

  <div class="input-section">
    <label>Tu pregunta al consejo</label>
    <textarea id="question" placeholder="Ej: ¿Debería publicar 3 veces por semana en Instagram o es mejor publicar menos pero con más calidad?"></textarea>
    <div id="error" class="error-msg" style="display:none"></div>
    <button class="btn-consult" id="btn-consult" onclick="consultarConsejo()">
      ⚖️ Consultar al Consejo
    </button>
  </div>

  <div class="responses" id="responses"></div>

  <button class="btn-reset" id="btn-reset" style="display:none" onclick="resetear()">
    Nueva consulta
  </button>
</main>

<script>
  const AGENTS = [
    { key: 'estratega', name: 'El Estratega', role: 'Estrategia y oportunidades', emoji: '🎯', card: 'card-estratega' },
    { key: 'critico',   name: 'El Crítico',   role: 'Puntos débiles y riesgos',   emoji: '🔍', card: 'card-critico' },
    { key: 'abogado',   name: 'Abogado del Diablo', role: 'Desafío de supuestos', emoji: '⚡', card: 'card-abogado' },
    { key: 'verificador', name: 'El Verificador', role: 'Control de hechos',      emoji: '✅', card: 'card-verificador' },
    { key: 'juez',      name: 'El Juez',       role: 'Veredicto final',            emoji: '⚖️', card: 'card-juez' },
  ];

  async function consultarConsejo() {
    const question = document.getElementById('question').value.trim();
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'none';

    if (!question) {
      errorEl.textContent = 'Por favor escribí tu pregunta antes de consultar al consejo.';
      errorEl.style.display = 'block';
      return;
    }

    document.getElementById('btn-consult').disabled = true;
    document.getElementById('btn-consult').textContent = 'El consejo está deliberando...';
    document.getElementById('responses').innerHTML = '';
    document.getElementById('btn-reset').style.display = 'none';

    const previousResponses = [];

    for (const agent of AGENTS) {
      activateBadge(agent.key);
      const card = createCard(agent);
      document.getElementById('responses').appendChild(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      try {
        const res = await fetch('/.netlify/functions/council', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, agent: agent.key, previousResponses }),
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Error desconocido');

        fillCard(card, data.response);
        previousResponses.push({ agentName: agent.name, response: data.response });
        deactivateBadge(agent.key);

      } catch (err) {
        fillCard(card, '⚠️ Error al consultar este agente. Intentá de nuevo.');
        deactivateBadge(agent.key);
      }
    }

    document.getElementById('btn-consult').disabled = false;
    document.getElementById('btn-consult').textContent = '⚖️ Consultar al Consejo';
    document.getElementById('btn-reset').style.display = 'block';
  }

  function createCard(agent) {
    const card = document.createElement('div');
    card.className = `agent-card ${agent.card}`;
    card.innerHTML = `
      <div class="agent-card-header">
        <div class="agent-icon">${agent.emoji}</div>
        <div>
          <div class="agent-name">${agent.name}</div>
          <div class="agent-role">${agent.role}</div>
        </div>
      </div>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    `;
    return card;
  }

  function fillCard(card, text) {
    const loading = card.querySelector('.loading-dots');
    loading.remove();
    const body = document.createElement('div');
    body.className = 'agent-card-body';
    body.textContent = text;
    card.appendChild(body);
  }

  function activateBadge(key) {
    document.getElementById(`badge-${key}`)?.classList.add('active');
  }

  function deactivateBadge(key) {
    document.getElementById(`badge-${key}`)?.classList.remove('active');
  }

  function resetear() {
    document.getElementById('question').value = '';
    document.getElementById('responses').innerHTML = '';
    document.getElementById('btn-reset').style.display = 'none';
    document.getElementById('question').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
